<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="RK monogram">
    <defs>
        <style>
            .bg { fill: #000; }
            .fg { fill: #fff; font: 700 56px 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
            @media (prefers-color-scheme: dark) {
                .bg { fill: #fff; }
                .fg { fill: #000; }
            }
        </style>
    </defs>
    <rect class="bg" x="8" y="8" width="112" height="112" rx="24" ry="24" />
    <text class="fg" x="64" y="76" text-anchor="middle" dominant-baseline="middle">RK</text>
</svg>
